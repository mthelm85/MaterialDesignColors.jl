[deps]
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
LiveServer = "16fef848-5104-11e9-1b77-fb7a48bbb589"
MaterialDesignColors = "3927ea69-822a-40ab-97d4-2bc957378337"
MaterialDocs = "10bdffc8-969c-4dd4-83f3-742518eccd6b"

[compat]
Documenter = "1"
MaterialDocs = "0.1"

# MaterialDocs depends on MaterialDesignColors, so these docs form a cycle — but
# only at docs-build time. The package itself has no such dependency, and docs/
# is a separate environment, so nothing circular reaches the registry. The local
# path wins over the copy MaterialDocs would pull in, so the docs are always
# built against the working tree.
[sources]
MaterialDesignColors = {path = ".."}
