name: Docs

on:
  # Allow rebuilding on demand — e.g. after changing this workflow, or to pick
  # up a dependency change that touched none of the paths below.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "*.toml"
      # Changes to this workflow must be able to trigger it, otherwise a fix
      # to the workflow itself never runs.
      - ".github/workflows/Docs.yml"
    tags: ["*"]
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "*.toml"
    types: [opened, synchronize, reopened]

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      # deploydocs pushes the built site to gh-pages using GITHUB_TOKEN, which
      # is read-only by default. Without this the build succeeds and the push
      # is refused with a 403.
      contents: write
      actions: write # lets julia-actions/cache clean up its own old caches
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - name: Use Julia cache
        uses: julia-actions/cache@v3
      - name: Instantiate environment with development version of the package
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Run doctest
        run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using MaterialDesignColors
            DocMeta.setdocmeta!(MaterialDesignColors, :DocTestSetup, :(using MaterialDesignColors); recursive=true)
            doctest(MaterialDesignColors)'
      - name: Generate and deploy documentation
        run: julia --project=docs docs/make.jl
        env:
          JULIA_PKG_SERVER: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GKSwstype: "100" # https://discourse.julialang.org/t/generation-of-documentation-fails-qt-qpa-xcb-could-not-connect-to-display/60988
